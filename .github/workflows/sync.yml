name: Sincronizar OPs do Tiny com o Dr Chef Produção

on:
  schedule:
    # A cada 20 minutos (dentro da faixa de 15-30 min pedida).
    # Horário em UTC — GitHub Actions não converte para horário de Brasília.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      estoque_dry_run:
        description: 'Fase 2 em modo simulação (não lança nada no Tiny)'
        type: boolean
        default: false
      estoque_so_op:
        description: 'Fase 2: rodar só nessas OPs (números separados por vírgula, ex 3526)'
        type: string
        default: ''

# Nunca deixa duas execuções rodando ao mesmo tempo — evita lançar o mesmo
# estoque duas vezes se uma rodada demorar mais que o intervalo do cron.
concurrency:
  group: sync-tiny
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Cache do navegador do Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador do Playwright (com dependências do sistema)
        run: npx playwright install --with-deps chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      - name: Instalar só as dependências de sistema (quando o navegador já está em cache)
        run: npx playwright install-deps chromium
        if: steps.cache-playwright.outputs.cache-hit == 'true'

      - name: Rodar sincronização
        env:
          TINY_SESSION_B64: ${{ secrets.TINY_SESSION_B64 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Usados só quando a sessão salva (TINY_SESSION_B64) está perto de
          # expirar ou já expirou — o script faz login automático sozinho
          # nessa hora (ver "RENOVAÇÃO AUTOMÁTICA DE SESSÃO" em sync-tiny-ops.js).
          TINY_USERNAME: ${{ secrets.TINY_USERNAME }}
          TINY_SENHA: ${{ secrets.TINY_SENHA }}
          # Só cria no Dr Chef as OPs criadas no Tiny a partir desta data
          # (formato AAAA-MM-DD). OPs mais antigas são ignoradas, mesmo que
          # ainda estejam "em aberto" no Tiny. Pode editar esse valor direto
          # aqui quando quiser mudar o corte.
          DATA_CORTE: '2026-08-01'
          # --- Fase 2: lançar estoque no Tiny ao entrar em "Costura Finalizada" ---
          # COMEÇA DESLIGADA de propósito (mexe em estoque de verdade). Depois de
          # testar com "Run workflow" em modo simulação, troque para 'true' aqui.
          TINY_ESTOQUE_ENABLED: 'false'
          # Modo simulação / OP específica: controlados pelo "Run workflow" manual.
          TINY_ESTOQUE_DRY_RUN: ${{ github.event.inputs.estoque_dry_run || 'false' }}
          TINY_ESTOQUE_SO_OP: ${{ github.event.inputs.estoque_so_op || '' }}
          # TINY_ESTOQUE_DEPOSITO: 'Geral'         # depósito de entrada (padrão Geral)
          # TINY_ESTOQUE_MAX_TENTATIVAS: '5'       # bloqueia a OP depois de N falhas
        run: npm run sync

      - name: Guardar prints de erro da Fase 2 (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2-debug
          path: fase2-debug/
          if-no-files-found: ignore
          retention-days: 7
